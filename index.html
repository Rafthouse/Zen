<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A quiet browser of authentic Zen koans and parables. Discover existing teachings that meet your present moment."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F4F0E8" />

    <!--
      Fonts are loaded from Google Fonts. They are optional: the app degrades
      gracefully to system serif / sans-serif if the network is unavailable.
      - Cormorant Garamond / EB Garamond : literary serif for headings & koan text
      - Inter                            : humanist sans for UI
      - Noto Serif JP / Noto Sans JP     : native Japanese rendering
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital@0;1&family=Inter:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Zen in Every Moment</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This contemplative reader requires JavaScript to be enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
